<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Página pessoal de Faaaaall."
    />
    <title>Faaaaall</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #000;
        --ink: #f5f5f5;
        --muted: #b9b9b9;
        --line: rgba(255, 255, 255, 0.2);
        --panel: rgba(0, 0, 0, 0.5);
        --focus: #b7b1ff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .background-art,
      .background-shade {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .background-art {
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
        background: #000;
        filter: brightness(0.72) contrast(1.12) saturate(0.8);
      }

      .background-shade {
        z-index: 1;
        --reading-darkness: 0;
        --reading-blur: 0px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.12) 0%,
          rgba(0, 0, 0, 0.3) 32%,
          rgba(0, 0, 0, 0.78) 64%,
          rgba(0, 0, 0, 0.94) 100%
        );
      }

      .background-shade::after {
        position: absolute;
        inset: 0;
        content: "";
        background: rgba(0, 0, 0, 0.9);
        opacity: var(--reading-darkness);
        -webkit-backdrop-filter: blur(var(--reading-blur));
        backdrop-filter: blur(var(--reading-blur));
        will-change: opacity, backdrop-filter;
      }

      .site {
        position: relative;
        z-index: 2;
        width: min(100% - 2rem, 68rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: 0 0 5rem;
      }

      .sections {
        display: grid;
        gap: clamp(3.5rem, 10vh, 6.5rem);
        margin-top: max(18rem, 54vh);
      }

      .section {
        width: min(100%, 62rem);
        margin: 0 auto;
      }

      .section-heading {
        margin: 0;
        color: var(--ink);
        font-size: 1.2rem;
        font-weight: 700;
        text-align: center;
      }

      .about-copy {
        width: min(100%, 42rem);
        margin: 1rem auto 0;
        color: var(--muted);
        line-height: 1.7;
        text-align: left;
      }

      .about-copy p {
        margin: 0;
      }

      .about-placeholder {
        color: rgba(245, 245, 245, 0.58);
        font-style: italic;
      }

      .posts-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
        width: 100%;
        margin-top: 1rem;
      }

      .post {
        display: grid;
        gap: 0.42rem;
        min-height: 8rem;
        border: 1px solid var(--line);
        border-radius: 0.7rem;
        background: var(--panel);
        padding: 1rem;
        color: inherit;
        text-align: left;
        text-decoration: none;
        transition: border-color 160ms ease, background 160ms ease,
          transform 160ms ease;
      }

      .post:hover {
        border-color: rgba(255, 255, 255, 0.48);
        background: rgba(0, 0, 0, 0.67);
        transform: translateY(-2px);
      }

      .post-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .post-title {
        font-weight: 700;
      }

      .post-arrow {
        color: var(--muted);
        font-size: 1.25rem;
        font-weight: 400;
      }

      .post-description {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .posts-empty {
        grid-column: 1 / -1;
        margin: 0;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        border-radius: 0.7rem;
        background: rgba(0, 0, 0, 0.32);
        padding: 1rem;
        color: var(--muted);
        text-align: center;
      }

      .links-list {
        display: grid;
        justify-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .links-list a {
        color: var(--ink);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 48rem) {
        .site {
          width: min(100% - 1.25rem, 52rem);
        }

        .sections {
          margin-top: max(15rem, 48vh);
        }

        .posts-list {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 34rem) {
        .background-art {
          object-position: 56% 12%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .post {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <img
      class="background-art"
      src="assets/hero.gif?v=efb88f0"
      alt=""
      aria-hidden="true"
    />
    <div class="background-shade" aria-hidden="true"></div>

    <main class="site">
      <h1 class="sr-only">Faaaaall</h1>

      <div class="sections">
        <section class="section" id="about" aria-labelledby="about-title">
          <h2 id="about-title" class="section-heading">about me</h2>
          <div class="about-copy">
            <p class="about-placeholder">texto em breve.</p>
          </div>
        </section>

        <section class="section" id="posts" aria-labelledby="posts-title">
          <h2 id="posts-title" class="section-heading">posts</h2>
          <div class="posts-list">
            <!-- Adicione cards .post aqui. A grade comporta dois por linha no desktop. -->
            <p class="posts-empty">nenhum post publicado ainda.</p>
          </div>
        </section>

        <section class="section" id="links" aria-labelledby="links-title">
          <h2 id="links-title" class="section-heading">links</h2>
          <div class="links-list">
            <a href="https://github.com/Faaaaall">GitHub</a>
          </div>
        </section>
      </div>
    </main>

    <script>
      const backgroundShade = document.querySelector(".background-shade");
      let readingFrame;

      const updateReadingMode = () => {
        if (readingFrame) {
          return;
        }

        readingFrame = requestAnimationFrame(() => {
          const progress = Math.min(window.scrollY / 360, 1);

          backgroundShade.style.setProperty("--reading-darkness", progress);
          backgroundShade.style.setProperty(
            "--reading-blur",
            `${progress * 12}px`,
          );
          readingFrame = undefined;
        });
      };

      updateReadingMode();
      window.addEventListener("scroll", updateReadingMode, { passive: true });
    </script>
  </body>
</html>
